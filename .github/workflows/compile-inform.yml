name: Compile Inform 6

on:
  push:
    paths:
      - '*.inf'
      - '.github/workflows/compile-inform.yml'
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Inform 6.44 compiler from source
        run: |
          git clone --depth 1 https://github.com/DavidKinder/Inform6.git /tmp/inform6src
          cd /tmp/inform6src
          cc -O2 --std=c11 -DUNIX -o inform6 *.c
          sudo mv inform6 /usr/local/bin/

      - name: Compile adventure_lovecraft.inf
        run: |
          cd inform6lib/inform6lib-master
          ln -s parser.h Parser.h
          ln -s verblib.h VerbLib.h
          ln -s grammar.h Grammar.h
          ln -s english.h English.h
          cd ../..
          inform6 +inform6lib/inform6lib-master adventure_lovecraft.inf
          ls -lh adventure_lovecraft.z5

      - name: Commit and push compiled file
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          if git diff --quiet adventure_lovecraft.z5; then
            echo "No changes to adventure_lovecraft.z5"
          else
            git add -f adventure_lovecraft.z5
            git commit -m "Auto-compile adventure_lovecraft.inf [skip ci]"
            git push origin main
          fi
