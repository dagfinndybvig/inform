name: Compile Inform 6

on:
  push:
    paths:
      - '*.inf'
      - '.github/workflows/compile-inform.yml'
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Inform 6 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y inform

      - name: Compile .inf files to adventure_lovecraft.z5
        run: |
          for inf_file in *.inf; do
            if [ -f "$inf_file" ]; then
              echo "Compiling $inf_file to adventure_lovecraft.z5"
              inform -v5 "$inf_file" "adventure_lovecraft.z5"
            fi
          done
          ls -lh adventure_lovecraft.z5

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f adventure_lovecraft.z5
          git diff --cached --quiet || (git commit -m "Compile to adventure_lovecraft.z5 [skip ci]" && git push origin main)
