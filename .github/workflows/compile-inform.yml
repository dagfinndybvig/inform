name: Compile Inform 6

on:
  push:
    paths:
      - '*.inf'
      - '.github/workflows/compile-inform.yml'
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inform 6 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y inform

      - name: Compile adventure_lovecraft.inf
        run: |
          inform -v5 adventure_lovecraft.inf adventure_lovecraft.z5
          ls -lh adventure_lovecraft.z5

      - name: Commit and push compiled file
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          if git diff --quiet adventure_lovecraft.z5; then
            echo "No changes to adventure_lovecraft.z5"
          else
            git add adventure_lovecraft.z5
            git commit -m "Auto-compile adventure_lovecraft.inf [skip ci]"
            git push origin main
          fi
