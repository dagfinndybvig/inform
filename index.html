<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Goddess in the Cellar</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 1.5rem; color: #a0a0a0; }
        .loading { color: #888; }
        a {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #16213e;
            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #30475e;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        a:hover { background: #30475e; }
    </style>
</head>
<body>
    <h1>The Goddess in the Cellar</h1>
    <p class="loading">Loading the game in your browser via Parchment...</p>
    <p id="status"></p>
    <p><a id="gameLink" href="#">Click here to play if it doesn't load</a></p>

    <script>
        // Direct approach: fetch the raw file and redirect immediately
        (function() {
            // Use raw.githubusercontent.com directly - it has cache headers we can work with
            const storyUrl = 'https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5';
            const gameLink = `https://iplayif.com/?story=${encodeURIComponent(storyUrl)}`;
            
            // Set fallback link
            document.getElementById('gameLink').href = gameLink;
            
            // Try to redirect after a brief delay to let the page render
            setTimeout(() => {
                window.location.href = gameLink;
            }, 500);
        })();
    </script>
</body>
</html>
