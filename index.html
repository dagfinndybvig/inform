<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Goddess in the Cellar</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 1.5rem; color: #a0a0a0; }
        a {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #16213e;
            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #30475e;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        a:hover { background: #30475e; }
    </style>
    <script>
        // Add cache-busting query parameter based on current date
        // This forces browsers to re-fetch the .z5 file after each day
        const today = new Date().toISOString().split('T')[0];
        const storyUrl = `https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5?v=${today}`;
        const gameLink = `https://iplayif.com/?story=${encodeURIComponent(storyUrl)}`;
        
        // Redirect to the game
        window.location.href = gameLink;
    </script>
    <meta http-equiv="refresh" content="0; url=https://iplayif.com/?story=https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5">
</head>
<body>
    <h1>The Goddess in the Cellar</h1>
    <p>Loading the game in your browser via Parchment...</p>
    <p>If it does not load automatically, <a id="gameLink" href="#">click here to play</a>.</p>
    <script>
        // Set the link href as well
        const today = new Date().toISOString().split('T')[0];
        const storyUrl = `https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5?v=${today}`;
        document.getElementById('gameLink').href = `https://iplayif.com/?story=${encodeURIComponent(storyUrl)}`;
    </script>
</body>
</html>
