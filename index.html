<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Goddess in the Cellar</title>
    <style>
        body {
            margin: 0;
            padding: 1rem;
            font-family: monospace;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        #gameContainer {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            border: 1px solid #444;
            background: #0f0f1e;
            min-height: 400px;
        }
        h1 { margin-top: 0; }
        #loading {
            padding: 2rem;
            text-align: center;
            color: #888;
        }
        .error {
            color: #f44;
            padding: 1rem;
            border: 1px solid #f44;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>The Goddess in the Cellar</h1>
        <div id="loading">Loading game...</div>
    </div>

    <script>
        // Redirect to iplayif.com with a fresh URL that forces reload
        window.addEventListener('load', function() {
            // Use GitHub's raw CDN with cache-busting hash based on server time
            const timestamp = Math.floor(Date.now() / 1000);
            const storyUrl = `https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5?v=${timestamp}`;
            const gameLink = `https://iplayif.com/?story=${encodeURIComponent(storyUrl)}`;
            
            // Redirect to iplayif
            window.location.href = gameLink;
        });
    </script>
</body>
</html>
