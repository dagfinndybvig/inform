<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Goddess in the Cellar</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 1.5rem; color: #a0a0a0; }
        a {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #16213e;
            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #30475e;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        a:hover { background: #30475e; }
        .loading { color: #888; }
    </style>
    <script>
        // Fetch the latest .z5 file from GitHub API and redirect to iplayif
        async function loadGame() {
            try {
                // Use GitHub API to get the latest version
                const response = await fetch('https://api.github.com/repos/dagfinndybvig/inform/contents/adventure_lovecraft.z5');
                const data = await response.json();
                
                if (data.download_url) {
                    // Use the download_url from API, which bypasses cache
                    const gameLink = `https://iplayif.com/?story=${encodeURIComponent(data.download_url)}`;
                    window.location.href = gameLink;
                } else {
                    throw new Error('Could not fetch download URL');
                }
            } catch (error) {
                console.error('Error loading game:', error);
                // Fallback to raw GitHub URL
                const fallbackUrl = 'https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5';
                const gameLink = `https://iplayif.com/?story=${encodeURIComponent(fallbackUrl)}`;
                window.location.href = gameLink;
            }
        }
        
        // Load game on page load
        window.addEventListener('load', loadGame);
    </script>
</head>
<body>
    <h1>The Goddess in the Cellar</h1>
    <p class="loading">Loading the game in your browser via Parchment...</p>
    <p>If it does not load automatically, <a href="https://iplayif.com/?story=https://raw.githubusercontent.com/dagfinndybvig/inform/main/adventure_lovecraft.z5">click here to play</a>.</p>
</body>
</html>
